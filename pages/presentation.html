<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMW IT Hub Presentation - Erin David Cullen</title>
    <!-- Theme initialization BEFORE page render -->
    <script>
        // Immediately set theme to prevent flash
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <link rel="stylesheet" href="../static/css/output.css">
    <link rel="stylesheet" href="../static/css/colours.css">
    <script src="../static/js/main.js" defer></script>
    <script src="../static/js/navbar.js" defer></script>
</head>

<body class="min-h-screen" style="background-color: var(--color-base); color: var(--color-text);">
    <!-- Navigation Container -->
    <div id="navbar-container"></div>

    <!-- Main Content -->
    <main class="p-6">
        <div class="max-w-4xl mx-auto mt-8">
            <!-- Page Header -->
            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold mb-2" style="color: var(--color-primary);">BMW IT Hub Presentation</h1>
                <p class="text-lg" style="color: var(--color-subtle);">Graduate Program Application</p>
            </div>

            <!-- Presentation Template - Ready for content -->
            <div class="space-y-16">
                <!-- Presentation sections will be added here -->
                <section class="min-h-screen flex items-center justify-center rounded-2xl shadow-xl" 
                         style="background: linear-gradient(135deg, var(--color-surface), var(--color-overlay));">
                    <div class="text-center">
                        <h2 class="text-6xl font-bold mb-8" style="color: var(--color-primary);">
                            Ready for Your Presentation
                        </h2>
                        <p class="text-2xl" style="color: var(--color-subtle);">
                            This template is ready for scroll-triggered animations and fade-in backgrounds
                        </p>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script>
        // Initialize navbar with presentation page as active
        initializeNavbar('presentation');
    </script>
</body>
</html>
